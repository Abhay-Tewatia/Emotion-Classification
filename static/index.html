<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Detect the emotion hidden in a sentence using a BiGRU deep learning model." />
  <title>Emotion Lens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="container">
    <header class="hero reveal">
      <p class="eyebrow">BiGRU · Emotion Classification</p>
      <h1>What is this sentence <em>feeling?</em></h1>
      <p class="subtitle">Type a sentence and the model will read the emotion behind it.</p>
    </header>

    <section class="card input-card reveal" style="--delay: 0.1s">
      <form id="analyze-form" novalidate>
        <label for="text-input" class="sr-only">Sentence to analyze</label>
        <textarea id="text-input" rows="3" maxlength="200" placeholder="e.g. I feel so happy and excited today"></textarea>
        <div class="input-footer">
          <div class="chips" id="chips">
            <button type="button" class="chip" data-text="I can't believe they cancelled the show">Surprise</button>
            <button type="button" class="chip" data-text="I miss the way things used to be">Sadness</button>
            <button type="button" class="chip" data-text="Walking home alone in the dark scared me">Fear</button>
            <button type="button" class="chip" data-text="You are the best thing that ever happened to me">Love</button>
          </div>
          <div class="actions">
            <span id="counter" class="counter">0 / 200</span>
            <button type="submit" id="submit-btn" class="btn-primary">
              <span class="btn-label">Analyze</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <section id="result" class="card result-card" aria-live="polite" hidden>
      <div class="result-top">
        <div class="emoji-wrap">
          <span id="result-emoji" class="result-emoji">🙂</span>
        </div>
        <div class="result-meta">
          <p class="label">Detected emotion</p>
          <h2 id="result-emotion">—</h2>
          <p class="confidence">Confidence <strong id="result-confidence">0%</strong></p>
        </div>
      </div>
      <div class="bars" id="bars"></div>
    </section>

    <section class="card history-card reveal" id="history-section" hidden style="--delay: 0.2s">
      <div class="history-head">
        <h3>Recent</h3>
        <button type="button" id="clear-history" class="link-btn">Clear</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </section>

    <footer class="footer">
      <span id="status-dot" class="status-dot" data-state="checking"></span>
      <span id="status-text">Checking model…</span>
    </footer>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
